name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck -w plate-engine
      - run: npm test
      - run: npm run build
      - run: npm run docs
      - run: npx playwright install --with-deps chromium
      - name: Studio end-to-end tests
        run: npm run e2e
        env:
          CI: 'true'
      - name: WebGL matches CPU (SwiftShader)
        run: node packages/plate-engine/scripts/bench.mjs --no-generators
